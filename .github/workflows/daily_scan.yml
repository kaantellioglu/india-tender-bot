name: Daily Tender Scan

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-tender-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt
      - name: Tarama öncesi arşivi kopyala
        run: cp data/India_Procurement_Intelligence_Database.xlsx "$RUNNER_TEMP/india-before.xlsx"
      - name: Taramayi calistir
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --max-pdf-parses 120
      - name: Son tarama sonuçlarını üret
        run: python -m scripts.export_live_scan --before "$RUNNER_TEMP/india-before.xlsx" --after data/India_Procurement_Intelligence_Database.xlsx --out docs/data.json
      - name: Guncellenen dosyalari commitle ve pushla
        run: |
          git config user.name "eska-tender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/India_Procurement_Intelligence_Database.xlsx docs/data.json data/source_failures.json data/action_queue.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Otomatik clean market intelligence: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
